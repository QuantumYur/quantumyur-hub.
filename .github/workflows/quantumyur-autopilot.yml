name: QuantumYur Autopilot - one file

on:
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * *'

concurrency:
  group: quantumyur-autopilot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ vars.QY_AUTOPILOT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.pick.outputs.ready }}
      task_id: ${{ steps.pick.outputs.task_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select next task (skip merged and currently open proposals)
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTASK'
          import base64,zlib,json,os,subprocess
          from pathlib import Path
          data=json.loads(zlib.decompress(base64.b64decode('')).decode('utf-8'))
          prs=json.loads(subprocess.check_output(['gh','pr','list','--state','all','--limit','200',
                 '--json','headRefName,mergedAt,state'],text=True))
          open_pr=any(p['headRefName'].startswith('autopilot/') and p['state']=='OPEN' for p in prs)
          merged={p['headRefName'].split('/')[-1] for p in prs
                  if p.get('mergedAt') and p['headRefName'].startswith('autopilot/')}
          task=next((t for t in data if t['state']=='pending' and t['id'] not in merged),None)
          ready=bool(task and not open_pr)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('ready='+str(ready).lower()+'\n')
              if ready:f.write('task_id='+task['id']+'\n')
          if ready:
              prompt=f"""Implement or verify exactly one QuantumYur Hub improvement: {task['id']},
              Area: {task['area']}. Requirement: {task['title']}.
              Read only relevant portions of index.html; do not print embedded base64 images.
              You may edit index.html ONLY. Preserve all 54 worlds, the v47 approved
              main-screen aesthetic, lab, Genesis, media players, book reader and archives.
              Do not change GitHub workflows, secrets, external dependencies, or other files.
              No synthetic data should be claimed as physical observations.
              If already done, leave code unchanged and explain evidence clearly.
              If impossible without a server or licensed assets, do not fake completion;
              explain the blocker. Keep a single self-contained HTML file.
              Review and test any code edits before finishing."""
              Path('.qy-autopilot-instruction.txt').write_text(prompt,encoding='utf-8')
              print('Next task:',task['id'],task['title'])
          elif open_pr:print('Existing Autopilot PR must be reviewed first.')
          else:print('All eligible tasks have been proposed.')
          PYTASK
      - name: Generate one carefully scoped proposal
        if: steps.pick.outputs.ready == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt-file: .qy-autopilot-instruction.txt
          output-file: .qy-codex-result.txt
      - name: Validate and write review note
        if: steps.pick.outputs.ready == 'true'
        env:
          TASK_ID: ${{ steps.pick.outputs.task_id }}
        run: |
          python - <<'PYVALIDATE'
          from html.parser import HTMLParser
          from pathlib import Path
          import os,subprocess,tempfile,json
          src=Path('index.html').read_text(encoding='utf-8')
          old=subprocess.check_output(['git','show','HEAD:index.html']).decode('utf-8')
          assert len(src)>=len(old)*0.88, 'Potential loss of embedded assets'
          for marker in ('QuantumYur','Genesis','Thomson','54','</html>'):
              assert marker.lower() in src.lower(), 'Required marker missing: '+marker
          changed=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          assert all(n=='index.html' for n in changed), 'Unexpected source modifications: '+str(changed)
          class P(HTMLParser):
              def __init__(self):super().__init__();self.current=None;self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script':
                      a=dict(attrs)
                      self.current=[] if not a.get('src') and a.get('type','') in ('','text/javascript','module') else None
              def handle_data(self,data):
                  if self.current is not None:self.current.append(data)
              def handle_endtag(self,tag):
                  if tag=='script' and self.current is not None:
                      self.scripts.append(''.join(self.current));self.current=None
          p=P();p.feed(src)
          assert len(p.scripts)>=40,'Too few scripts compared with QuantumYur builds'
          for num,code in enumerate(p.scripts):
              if not code.strip():continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(code);name=f.name
              try:
                  r=subprocess.run(['node','--check',name],capture_output=True,text=True)
                  assert r.returncode==0,f'JS #{num}: {r.stderr[-350:]}'
              finally:Path(name).unlink(missing_ok=True)
          report=Path('autopilot/reports')/(os.environ['TASK_ID']+'.md')
          report.parent.mkdir(parents=True,exist_ok=True)
          result=Path('.qy-codex-result.txt')
          summary=result.read_text(encoding='utf-8')[:10000] if result.exists() else 'Agent did not provide a summary.'
          report.write_text('# '+os.environ['TASK_ID']+'\n\n'+
             ('Code changes prepared for review.\n' if 'index.html' in changed else 'No code changes: requires review.\n')+
             '\n## Agent report\n'+summary+'\n\n## Local check\n'+
             f'{len(p.scripts)} embedded JavaScript scripts passed node --check.\n'+
             'Real Android use and data storage were NOT tested.\n',encoding='utf-8')
          print('Validated',len(p.scripts),'JavaScript blocks; code changed:',bool(changed))
          PYVALIDATE
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.ready == 'true'
        with:
          name: quantumyur-proposal
          path: |
            index.html
            autopilot/reports/
          retention-days: 7

  proposal:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: quantumyur-proposal
          path: .
      - name: Create Pull Request - NEVER auto merge
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: autopilot/${{ needs.prepare.outputs.task_id }}
          delete-branch: true
          add-paths: |
            index.html
            autopilot/reports/
          title: 'QuantumYur Autopilot: ${{ needs.prepare.outputs.task_id }}'
          commit-message: 'autopilot: propose ${{ needs.prepare.outputs.task_id }}'
          body: |
            Automated one-task proposal. Read the report in autopilot/reports/.
            Verify changes and test on Android BEFORE merging.
            This workflow never auto-merges or deploys changes.

